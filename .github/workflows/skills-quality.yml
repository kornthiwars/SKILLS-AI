name: Skills quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke skills and rules
        run: |
          chmod +x scripts/smoke-skills.sh scripts/change-control-check.sh
          ./scripts/smoke-skills.sh

      - name: Change-control budget (PR vs main)
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          if git rev-parse origin/main >/dev/null 2>&1; then
            export DIFF_BASE=origin/main...HEAD
            ./scripts/change-control-check.sh
          else
            echo "origin/main not found — skip PR budget check"
          fi
